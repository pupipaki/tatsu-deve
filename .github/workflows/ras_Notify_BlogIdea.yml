name: Notify Blog Ideas

on:
  schedule:
    # GitHub Actions の cron は UTC。JST 20:00 に実行したい場合は UTC 11:00 に設定する
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on:
      - self-hosted
      - raspi
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TARGET_SECTION_KEYWORD: ${{ secrets.TARGET_SECTION_KEYWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure Python 3 is available
        run: |
          python3 --version

      - name: Create and activate venv, install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -U google-generativeai requests

      - name: Run Blog Idea daily
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_SECTION_KEYWORD: "keyword"
          WORDPRESS_NEW_POST_URL_BASE: "https://example.com/wp-admin/post-new.php"
        run: |
          . .venv/bin/activate
          python Notify_BlogIdea.py
