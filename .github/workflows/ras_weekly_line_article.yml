name: Weekly LINE article Flex

on:
  schedule:
    # 毎週月曜 9:00 JST (UTC 0:00)
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  notify:
    name: Notify Weekly LINE Flex
    runs-on:
      - self-hosted
      - raspi
    timeout-minutes: 30
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TARGET_SECTION_NAME: ${{ secrets.TARGET_SECTION_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WORDPRESS_NEW_POST_URL_BASE: "https://example.com/wp-admin/post-new.php"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure python3 and venv available
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip
          python3 --version

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          # requirements.txt があればそれを使う
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install -U google-generativeai requests
          fi

      - name: Run notifier
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_SECTION_NAME: "article"
          WORDPRESS_NEW_POST_URL_BASE: "https://example.com/wp-admin/post-new.php"
        run: |
          . .venv/bin/activate
          python send_flex.py
