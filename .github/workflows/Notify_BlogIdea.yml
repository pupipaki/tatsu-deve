name: Notify Blog Ideas

on:
  schedule:
    - cron: '0 20 * * *'  # 毎日20時
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
      REDIRECT_URI: ${{ secrets.REDIRECT_URI }}
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
      LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      TARGET_SECTION_NAME: ${{ secrets.TARGET_SECTION_NAME }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -U google-generativeai requests
      - name: Run notifier
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # これも忘れずに追加してください
          TARGET_SECTION_NAME: "article"
          WORDPRESS_NEW_POST_URL_BASE: "https://example.com/wp-admin/post-new.php"
        run: python Notify_BlogIdea.py
