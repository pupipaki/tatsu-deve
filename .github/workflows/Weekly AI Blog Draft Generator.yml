name: Weekly AI Blog Draft Generator

on:
  schedule:
    # 毎週金曜日 17:00 JST (08:00 UTC)
    - cron: '0 8 * * 5'
  workflow_dispatch: # 手動実行もできるように設定

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests google-generativeai

      - name: Run AI Blogger Script
        env:
          # Microsoft Graph API (OneNote)
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          
          # Gemini API
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          
          # WordPress API
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          
          # LINE Notify / Messaging API
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          
          # その他設定
          TARGET_SECTION_NAME: "write" # セクション名を指定
        run: Gemini_WordPress.py # あなたのPythonファイル名に合わせて変更してください
